name: carton_pro
description: "Application for managing corrugated box factories."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.1
  flutter_iconpicker: ^3.6.1
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.5
  # Remove simple_splash_view
  change_app_package_name: ^1.5.0
  camera: ^0.11.3
  image_picker: ^1.2.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # - assets/icons/
    # - assets/translations/
    # Add splash assets
    # - assets/splash/
    

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# Remove simple_splash_view configuration