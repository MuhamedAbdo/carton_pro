name: carton_pro
description: "Application for managing corrugated box factories."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.1
  flutter_iconpicker: ^3.6.1
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.5
  # Add the splash package
  simple_splash_view: ^0.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # - assets/icons/
    # - assets/translations/
    # Add splash assets
    # - assets/splash/
    

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# Add splash configuration
simple_splash_view:
  image: assets/images/logo_light.png
  image_dark: assets/images/logo_dark.png
  sound: assets/audio/intro.mp3
  text: "CartonPro"
  background_color: "#FFFFFF"
  background_color_dark: "#121212"
  text_color: "#1E1E1E"
  text_color_dark: "#FAFAFA"
  indicator: true
  indicator_color: "#FF5722"
  indicator_color_dark: "#FFC107"
  indicator_position: below_visual
  text_position: bottom
  duration: 3200
  theme:
    mode: system
    app_theme: "Theme.App"
    splash_theme: "Theme.Splash"